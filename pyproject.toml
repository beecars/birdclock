[project]
name = "birdclock-songs"
version = "0.1.0"
description = "Fetch and preprocess bird songs for the birdclock rpi"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydub>=0.25.1",
    "python-dotenv>=1.0",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "numpy>=1.26",
]

[project.optional-dependencies]
deploy = ["flask>=3.0"]

[project.scripts]
birdclock-songs = "collect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collect"]
